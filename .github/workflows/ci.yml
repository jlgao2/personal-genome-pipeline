name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 7 * * *'   # 07:17 UTC daily — off the :00 mark to spread API load
  workflow_dispatch:

jobs:
  test-and-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v

      - name: Run demo refresh
        run: bash pipeline/refresh.sh --demo

      - name: Verify generated JS imports
        run: |
          node --input-type=module -e "
            const { VITALS } = await import('file:///tmp/web-demo/data-vitals.js');
            const keys = Object.keys(VITALS);
            console.log('vitals keys:', keys);
            if (keys.length === 0) throw new Error('VITALS empty');
          "

      - name: Privacy guard — fail if real data leaked
        run: |
          if git ls-files | grep -E '^data/' ; then
            echo "ERROR: data/ files tracked" >&2
            exit 1
          fi
          if git ls-files | grep -E '^output/web/js/(data\.js|data-vitals\.js)$' ; then
            echo "ERROR: personal data files tracked" >&2
            exit 1
          fi
          if git ls-files | grep -E '^output/cross_refs\.yaml$' ; then
            echo "ERROR: personal cross_refs.yaml tracked" >&2
            exit 1
          fi
